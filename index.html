<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIQ 중요도-만족도 매트릭스</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --paper:#F5F3EC;
    --panel:#FCFBF7;
    --ink:#242A2E;
    --line:#C9C1AE;
    --line-soft:#DAD4C4;
    --accent:#3A5A6B;
    --accent-soft:#AFC3CC;
    --warn:#B5654A;
    --warn-soft:#E9CFC4;
    --good:#5C7A5E;
    --good-soft:#D3DECB;
    --muted:#847C6C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family: ui-sans-serif, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height:1.5;
    padding:32px 20px 60px;
  }
  .wrap{max-width:1100px; margin:0 auto;}
  header{margin-bottom:20px; border-bottom:2px solid var(--ink); padding-bottom:16px;}
  h1{
    font-family: Georgia, "Noto Serif KR", serif;
    font-size:26px;
    font-weight:600;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  header p{margin:0; color:var(--muted); font-size:14px;}

  .name-row{
    display:flex; align-items:center; gap:10px; margin-bottom:24px;
  }
  .name-row label{font-size:13px; font-weight:600; color:var(--ink);}
  .name-row input{
    border:1px solid var(--line); background:var(--panel);
    padding:7px 10px; font-size:13px; width:180px;
    font-family:inherit; color:var(--ink);
  }
  .name-row input:focus{outline:1.5px solid var(--accent); border-color:var(--accent);}
  .name-hint{font-size:12px; color:var(--muted);}

  .layout{display:flex; gap:28px; align-items:flex-start;}
  @media (max-width:900px){ .layout{flex-direction:column;} }

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
  }

  .input-panel{flex:1.3; min-width:0;}
  .panel-title{
    font-size:13px; font-weight:600; color:var(--ink);
    padding:12px 16px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
  }
  .reset-btn{
    background:none; border:1px solid var(--line); color:var(--muted);
    font-size:12px; padding:4px 10px; cursor:pointer;
  }
  .reset-btn:hover{border-color:var(--ink); color:var(--ink);}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:left; font-weight:600; color:var(--muted);
    font-size:12px; padding:8px 10px;
    border-bottom:1px solid var(--line);
  }
  tbody td{
    padding:7px 10px;
    border-bottom:1px solid var(--line-soft);
    vertical-align:middle;
  }
  tbody tr:last-child td{border-bottom:none;}
  .val-cell{color:var(--muted); font-size:12px; white-space:nowrap;}
  .need-cell{font-weight:500; white-space:nowrap;}

  .toggle-group{display:flex; gap:4px;}
  .toggle-btn{
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--muted);
    font-size:11px;
    padding:4px 8px;
    cursor:pointer;
    min-width:36px;
    text-align:center;
  }
  .toggle-btn:hover{border-color:var(--accent);}
  .toggle-btn.active-imp{background:var(--accent); color:#fff; border-color:var(--accent);}
  .toggle-btn.active-sat{background:var(--good); color:#fff; border-color:var(--good);}

  .grid-panel{flex:1; min-width:300px; position:sticky; top:24px;}
  .grid-title{
    font-size:13px; font-weight:600; padding:12px 16px;
    border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
  }
  .grid-body{padding:20px;}
  #captureArea{background:var(--panel);}
  .capture-heading{font-size:13px; font-weight:600; margin-bottom:14px; color:var(--ink);}
  .capture-heading .sub{font-weight:400; color:var(--muted); font-size:11px; display:block; margin-top:2px;}
  .axis-label-y{
    writing-mode:vertical-rl;
    text-orientation:mixed;
    font-size:12px; color:var(--muted); font-weight:600;
    text-align:center;
  }
  .grid-outer{display:flex; gap:8px;}
  .matrix{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    grid-template-rows:repeat(3, 90px);
    flex:1;
    border-top:1px solid var(--ink);
    border-left:1px solid var(--ink);
  }
  .cell{
    border-right:1px solid var(--ink);
    border-bottom:1px solid var(--ink);
    padding:6px 8px;
    font-size:11.5px;
    line-height:1.4;
    overflow:auto;
    background:var(--panel);
  }
  .cell.gap{background:var(--warn-soft);}
  .cell.strength{background:var(--good-soft);}
  .cell .chip{display:block; color:var(--ink);}

  .col-heads{display:flex; margin-left:26px; margin-bottom:4px;}
  .col-heads div{flex:1; text-align:center; font-size:11px; color:var(--muted); font-weight:600;}
  .row-heads-wrap{display:flex; flex-direction:column; justify-content:space-around;}
  .row-heads-wrap div{font-size:11px; color:var(--muted); font-weight:600; text-align:center;}

  .x-axis-label{text-align:center; font-size:12px; color:var(--muted); font-weight:600; margin-top:6px; margin-left:26px;}

  .legend{display:flex; flex-wrap:wrap; gap:16px; padding:0 20px 16px; font-size:11px; color:var(--muted);}
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .swatch{width:10px; height:10px; display:inline-block; border:1px solid var(--line);}

  .actions{display:flex; gap:8px; padding:0 20px 16px;}
  .action-btn{
    border:1px solid var(--ink); background:var(--ink); color:#fff;
    font-size:12px; padding:8px 14px; cursor:pointer; font-weight:500;
  }
  .action-btn:disabled{opacity:0.4; cursor:not-allowed;}
  .status-msg{font-size:12px; color:var(--muted); padding:0 20px 12px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MIQ 욕구 척도 — 중요도 · 만족도 매트릭스</h1>
    <p>각 욕구 척도의 중요도와 만족도를 선택하면 오른쪽 매트릭스에 자동으로 배치됩니다.</p>
  </header>

  <div class="name-row">
    <label for="nameInput">이름</label>
    <input id="nameInput" type="text" placeholder="이름을 입력하세요" oninput="onNameChange()">
    <span class="name-hint">결과 저장·공유 시 사용됩니다</span>
  </div>

  <div class="layout">
    <div class="panel input-panel">
      <div class="panel-title">
        <span>욕구 척도 평정</span>
        <button class="reset-btn" onclick="resetAll()">전체 초기화</button>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:14%">가치</th>
            <th style="width:22%">욕구 척도</th>
            <th style="width:32%">중요도</th>
            <th style="width:32%">만족도</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="panel grid-panel">
      <div class="grid-title">중요도 × 만족도 매트릭스</div>
      <div class="grid-body">
        <div id="captureArea">
          <div class="capture-heading" id="captureHeading">
            이름 미입력
            <span class="sub" id="captureSub"></span>
          </div>
          <div class="col-heads">
            <div>낮음</div><div>보통</div><div>높음</div>
          </div>
          <div class="grid-outer">
            <div class="axis-label-y">중요도</div>
            <div style="flex:1; display:flex; gap:8px;">
              <div class="row-heads-wrap" id="rowHeads"></div>
              <div class="matrix" id="matrix"></div>
            </div>
          </div>
          <div class="x-axis-label">만족도</div>
        </div>
      </div>
      <div class="legend">
        <span><i class="swatch" style="background:var(--warn-soft)"></i>중요도 높음·만족도 낮음 (보완 필요)</span>
        <span><i class="swatch" style="background:var(--good-soft)"></i>중요도 높음·만족도 높음 (강점)</span>
      </div>
      <div class="actions">
        <button class="action-btn" onclick="saveImage()">이미지로 저장</button>
      </div>
      <div class="status-msg" id="statusMsg"></div>
    </div>
  </div>
</div>

<script>
const DATA = [
  ["성취", "능력의 활용"], ["성취", "성취"],
  ["편안함", "활동성"], ["편안함", "독립성"], ["편안함", "다양성"],
  ["편안함", "보상"], ["편안함", "안정성"], ["편안함", "근무환경"],
  ["지위", "승진"], ["지위", "인정"], ["지위", "권위"], ["지위", "사회적 지위"],
  ["이타주의", "동료"], ["이타주의", "도덕적 가치"], ["이타주의", "사회봉사"],
  ["안전", "회사정책과 관행"], ["안전", "감독-인간관계"], ["안전", "감독-기술"],
  ["자율성", "창의성"], ["자율성", "책임성"]
];
const LEVELS = ["낮음", "보통", "높음"];
const IMP_ORDER = ["높음", "보통", "낮음"];
const SAT_ORDER = ["낮음", "보통", "높음"];
const state = {};

function buildTable(){
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  let lastVal = null;
  DATA.forEach(([val, need]) => {
    state[need] = state[need] || {imp:null, sat:null};
    const tr = document.createElement("tr");

    const valTd = document.createElement("td");
    valTd.className = "val-cell";
    valTd.textContent = (val === lastVal) ? "" : val;
    lastVal = val;
    tr.appendChild(valTd);

    const needTd = document.createElement("td");
    needTd.className = "need-cell";
    needTd.textContent = need;
    tr.appendChild(needTd);

    tr.appendChild(makeToggleCell(need, "imp"));
    tr.appendChild(makeToggleCell(need, "sat"));

    tbody.appendChild(tr);
  });
}

function makeToggleCell(need, kind){
  const td = document.createElement("td");
  const group = document.createElement("div");
  group.className = "toggle-group";
  LEVELS.forEach(level => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "toggle-btn";
    btn.textContent = level;
    btn.onclick = () => {
      state[need][kind] = level;
      renderMatrix();
      buildTable();
    };
    if(state[need][kind] === level){
      btn.classList.add(kind === "imp" ? "active-imp" : "active-sat");
    }
    group.appendChild(btn);
  });
  td.appendChild(group);
  return td;
}

function fillMatrixCells(matrixEl, dataState, compact){
  matrixEl.innerHTML = "";
  IMP_ORDER.forEach(imp => {
    SAT_ORDER.forEach(sat => {
      const cell = document.createElement("div");
      cell.className = compact ? "g-cell" : "cell";
      if(imp === "높음" && sat === "낮음") cell.classList.add("gap");
      if(imp === "높음" && sat === "높음") cell.classList.add("strength");
      DATA.forEach(([, need]) => {
        const s = dataState[need];
        if(s && s.imp === imp && s.sat === sat){
          const chip = document.createElement("span");
          if(!compact) chip.className = "chip";
          chip.textContent = need;
          cell.appendChild(chip);
          if(compact) cell.appendChild(document.createTextNode(" "));
        }
      });
      matrixEl.appendChild(cell);
    });
  });
}

function renderMatrix(){
  const rowHeads = document.getElementById("rowHeads");
  rowHeads.innerHTML = "<div>높음</div><div>보통</div><div>낮음</div>";
  fillMatrixCells(document.getElementById("matrix"), state, false);
}

function resetAll(){
  DATA.forEach(([, need]) => { state[need] = {imp:null, sat:null}; });
  buildTable();
  renderMatrix();
}

function onNameChange(){
  const name = document.getElementById("nameInput").value.trim();
  document.getElementById("captureHeading").firstChild.textContent = name ? (name + " 님의 결과") : "이름 미입력";
}

function setStatus(msg){
  document.getElementById("statusMsg").textContent = msg;
}

function saveImage(){
  if(typeof html2canvas === "undefined"){
    setStatus("이미지 저장 기능을 불러오지 못했습니다. 인터넷 연결을 확인해주세요.");
    return;
  }
  const name = document.getElementById("nameInput").value.trim() || "이름없음";
  const target = document.getElementById("captureArea");
  html2canvas(target, {backgroundColor: "#FCFBF7", scale: 2}).then(canvas => {
    const link = document.createElement("a");
    link.download = name + "_MIQ매트릭스.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
    setStatus("이미지가 저장되었습니다.");
  }).catch(() => {
    setStatus("이미지 저장 중 오류가 발생했습니다.");
  });
}

buildTable();
renderMatrix();
</script>
</body>
</html>
